spring:
  application:
    name: hrms-application

  datasource:
    url: jdbc:mysql://localhost:3306/hrms_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
    username: hrms_user
    password: hrms_password
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        default_schema: hrms_db
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    repair-on-migrate: true

server:
  port: 8080

application:
  security:
    jwt:
      secret-key: 404D635166546A576E5A7234753778214125442A472D4B6150645367566B5970
      expiration: 86400000        # 24 hours in milliseconds
      refresh-token:
        expiration: 604800000     # 7 days in milliseconds

logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE